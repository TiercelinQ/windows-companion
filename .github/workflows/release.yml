# Release: runs on every push to main (a merged pull request) and publishes the executable and
# WindowsCompanion-<version>-win-x64.zip as a new GitHub release (rules/packaging.md).
# The version is the csproj <Version> (bumped by /wpf-release inside the pull request, rules/versioning.md):
#   - the tag v<version> does not exist yet  -> the tag and the release are created;
#   - the tag already exists (no version bump) -> the files are built and kept as a run artifact only.
# A manual run (workflow_dispatch) is a dry run: it never creates a release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two merges in a row are handled one after the other, never in parallel.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PROJECT: src/WindowsCompanion.Wpf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The csproj <Version> is canonical, AppConfig.AppVersion mirrors it (rules/versioning.md).
      - name: Read the version and decide whether to release
        id: version
        shell: pwsh
        run: |
          $version = @(([xml](Get-Content "$env:PROJECT/WindowsCompanion.Wpf.csproj" -Raw)).Project.PropertyGroup.Version) |
              Where-Object { $_ } | Select-Object -First 1
          $mirror = (Select-String -Path "$env:PROJECT/AppConfig.cs" -Pattern 'AppVersion = "([^"]+)"').Matches[0].Groups[1].Value
          if ($version -ne $mirror) {
              throw "csproj Version ($version) and AppConfig.AppVersion ($mirror) differ."
          }
          git ls-remote --exit-code --tags origin "refs/tags/v$version" *> $null
          $tagExists = ($LASTEXITCODE -eq 0)
          $publish = ($env:GITHUB_EVENT_NAME -eq 'push') -and (-not $tagExists)
          Write-Host "Version $version, tag exists: $tagExists, publish: $publish"
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Debug --no-restore

      - name: Format and analyzers
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        run: dotnet test -c Debug --no-build

      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} -c Release -p:PublishProfile=win-x64

      - name: Archive
        id: archive
        shell: pwsh
        run: |
          $name = "WindowsCompanion-${{ steps.version.outputs.version }}-win-x64"
          Copy-Item publish/win-x64/WindowsCompanion.exe "publish/$name.exe"
          Compress-Archive -Path publish/win-x64/* -DestinationPath "publish/$name.zip" -Force
          "exe=publish/$name.exe" >> $env:GITHUB_OUTPUT
          "zip=publish/$name.zip" >> $env:GITHUB_OUTPUT
          Get-Item "publish/$name.exe", "publish/$name.zip" | Select-Object Name, Length

      # Release notes = the block of the released version in docs/release/CHANGELOG.md.
      - name: Release notes
        shell: pwsh
        run: |
          $lines = Get-Content docs/release/CHANGELOG.md -Encoding utf8
          $start = [Array]::FindIndex($lines, [Predicate[string]] { param($l) $l.StartsWith('## [${{ steps.version.outputs.version }}]') })
          if ($start -lt 0) { throw 'No changelog block for version ${{ steps.version.outputs.version }}.' }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
              if ($lines[$i].StartsWith('## [')) { $end = $i; break }
          }
          $notes = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          if (-not $notes) { throw 'The changelog block is empty.' }
          $notes += "`n`nThe executable is unsigned: Windows SmartScreen shows a warning the first time it runs from a download."
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          Get-Content release-notes.md

      # gh creates the tag v<version> on the merged commit.
      - name: GitHub release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" "${{ steps.archive.outputs.exe }}" "${{ steps.archive.outputs.zip }}" `
              --title "Windows Companion ${{ steps.version.outputs.version }}" --notes-file release-notes.md --target "$env:GITHUB_SHA"

      - name: Keep the files (no release created)
        if: steps.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WindowsCompanion-${{ steps.version.outputs.version }}-win-x64
          path: |
            ${{ steps.archive.outputs.exe }}
            ${{ steps.archive.outputs.zip }}
            release-notes.md
